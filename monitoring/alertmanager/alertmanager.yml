# Alerts are forwarded to the IGuard backend webhook, which creates deduplicated incidents and
# handles Telegram notification/recovery. The webhook token is injected at container start
# (see docker-compose.yml: alertmanager entrypoint renders this file with envsubst).
route:
  receiver: iguard
  group_by: [alertname, instance]
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: iguard
    webhook_configs:
      - url: http://backend:8000/api/v1/alerts/webhook
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: ${IGUARD_WEBHOOK_TOKEN}

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, instance]
