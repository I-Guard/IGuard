name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iguard
          POSTGRES_PASSWORD: iguard_ci
          POSTGRES_DB: iguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iguard" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - name: Type check (mypy)
        run: mypy app
      - name: Tests on SQLite
        run: python -m pytest tests -p no:cacheprovider --cov=app --cov-report=term --cov-report=xml
      - name: Tests on PostgreSQL
        env:
          IGUARD_TEST_DATABASE_URL: postgresql+psycopg://iguard:iguard_ci@localhost:5432/iguard_test
        run: python -m pytest tests -p no:cacheprovider
      - name: Migration drift check
        env:
          IGUARD_DATABASE_URL: postgresql+psycopg://iguard:iguard_ci@localhost:5432/iguard_test
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          e = create_engine("postgresql+psycopg://iguard:iguard_ci@localhost:5432/iguard_test")
          with e.begin() as c:
              c.execute(text("DROP SCHEMA public CASCADE; CREATE SCHEMA public;"))
          PY
          alembic upgrade head && alembic check
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate a throwaway E2E credential (ephemeral CI database only)
        run: |
          echo "E2E_PASSWORD=Ci-$(openssl rand -hex 16)-Aa1" >> "$GITHUB_ENV"
          echo "E2E_WEBHOOK_TOKEN=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Start backend (SQLite, no monitoring stack)
        working-directory: backend
        env:
          IGUARD_DATABASE_URL: sqlite:////tmp/e2e.db
          IGUARD_WEBHOOK_TOKEN: ${{ env.E2E_WEBHOOK_TOKEN }}
          IGUARD_PROMETHEUS_URL: http://127.0.0.1:1
          IGUARD_LOKI_URL: http://127.0.0.1:1
          IGUARD_ALERTMANAGER_URL: http://127.0.0.1:1
          IGUARD_INTEGRATION_TIMEOUT_SECONDS: "1"
        run: |
          pip install -e .
          alembic upgrade head
          python -m app.cli create-admin --email e2e@example.com --username e2eadmin --password "${E2E_PASSWORD}"
          nohup uvicorn app.main:app --port 8000 > /tmp/backend.log 2>&1 &
      - name: Build and serve frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npx vite preview --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          npx playwright install --with-deps chromium
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173 >/dev/null && curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null && break; sleep 1; done
      - name: Playwright
        working-directory: frontend
        env:
          E2E_USER: e2eadmin
          E2E_PASSWORD: ${{ env.E2E_PASSWORD }}
          E2E_WEBHOOK_TOKEN: ${{ env.E2E_WEBHOOK_TOKEN }}
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: frontend/playwright-report

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          cp .env.example .env
          for k in IGUARD_SECRET_KEY IGUARD_WEBHOOK_TOKEN RECOVERY_AGENT_SECRET POSTGRES_PASSWORD GRAFANA_ADMIN_PASSWORD; do
            sed -i "s|^$k=.*|$k=$(openssl rand -hex 32)|" .env
          done
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
      - name: Build images
        run: docker compose build
