name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: "Problem to solve" }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: "Proposed solution" }
  - type: textarea
    id: safety
    attributes: { label: "Security considerations", description: "Especially for anything touching recovery actions or authentication." }
