# Unprivileged nginx: serves the SPA and reverse-proxies /api to the backend.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $host $iguard_env { default "docker"; }

  # Structured JSON access log (collected by Promtail -> Loki). Authorization/cookies are never logged.
  map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }
  log_format json_access escape=json
    '{"timestamp":"$time_iso8601","severity":"INFO","service":"frontend","environment":"$iguard_env",'
    '"request_id":"$req_id","correlation_id":"$req_id","message":"$request_method $uri",'
    '"status":$status,"bytes":$body_bytes_sent,"duration_ms":"$request_time","remote_addr":"$remote_addr"}';
  access_log /dev/stdout json_access;

  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

    location = /api/v1/auth/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://backend:8000;
      include /etc/nginx/iguard-proxy.conf;
    }
    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://backend:8000;
      include /etc/nginx/iguard-proxy.conf;
      proxy_read_timeout 150s;   # recovery execution waits for health verification
    }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-store"; }
  }
}
